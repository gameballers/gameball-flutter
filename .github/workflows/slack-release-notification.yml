name: Slack release notification

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  notify:
    if: github.repository_owner == 'gameballers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Post release to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SDK_RELEASES_WEBHOOK_URL }}
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
        run: |
          case "$REPO" in
            gameball-ios) SDK="iOS SDK" ;;
            gameball-flutter) SDK="Flutter SDK" ;;
            gameball-react-native) SDK="React Native SDK" ;;
            gb-mobile-android) SDK="Android SDK" ;;
            *) SDK="$REPO" ;;
          esac
          echo "SDK=$SDK" >> "$GITHUB_ENV" # the Google Calendar step names its event with it

          # This version's CHANGELOG.md section: lines under "## [<version>]" up to the next "## [" heading,
          # with its "### " sub-headings turned into bold lines (Slack mrkdwn has no headings)
          NOTES=$(awk -v h="## [${VERSION#v}]" '
            index($0, h) == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on && sub(/^### /, "") { $0 = "**" $0 "**" }
            on && $0 != "---"
          ' CHANGELOG.md)

          WHATS_NEW="**What's new**

          ${NOTES:-See the release notes for details.}"

          # Only mrkdwn section blocks (no markdown block), so phone notifications show just `text` — verbatim, so it carries a
          # plain "@channel" (a raw <!channel> shows as-is there); the <!channel> in the headline section does the pinging.
          # CHANGELOG markdown -> mrkdwn: escape & < >, keep "> " quotes, **bold** -> *bold*, "- " -> "• ";
          # one section per paragraph keeps each under Slack's 3000-character section limit.
          jq -n --arg text "🚀 New $SDK release ($VERSION)
          @channel" \
            --arg headline "🚀 *New $SDK release ($VERSION)* — <$URL|Release notes>
          <!channel>" --arg notes "$WHATS_NEW" '
            [$notes | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;") | gsub("(?<s>^|\n)&gt; "; "\(.s)> ")
                    | gsub("[*][*]"; "*") | gsub("(?<s>^|\n)- "; "\(.s)• ") | splits("\n([ \t]*\n)+") | select(test("[^[:space:]]"))]
            | {text: $text, blocks: (([$headline] + .) | map({type: "section", text: {type: "mrkdwn", text: .}}))}
          ' | curl -fsS -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Add release to Google Calendar
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_CLIENT_EMAIL: ${{ secrets.GOOGLE_CALENDAR_CLIENT_EMAIL }}
          GOOGLE_CALENDAR_PRIVATE_KEY_ID: ${{ secrets.GOOGLE_CALENDAR_PRIVATE_KEY_ID }}
          GOOGLE_CALENDAR_PRIVATE_KEY: ${{ secrets.GOOGLE_CALENDAR_PRIVATE_KEY }}
          VERSION: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          AUTHOR: ${{ github.event.release.author.login }}
        run: |
          set -o pipefail
          # Same service account, calendar and event shape as the deployment bot's release events.
          # Service-account OAuth without a client library: an RS256-signed JWT is exchanged for an access token.
          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }
          JWT=$(jq -cn '{alg: "RS256", typ: "JWT", kid: env.GOOGLE_CALENDAR_PRIVATE_KEY_ID}' | b64url).$(jq -cn 'now | floor | {
            iss: env.GOOGLE_CALENDAR_CLIENT_EMAIL, scope: "https://www.googleapis.com/auth/calendar.events",
            aud: "https://oauth2.googleapis.com/token", iat: ., exp: (. + 3600)}' | b64url)
          # printf %b also takes the key with literal \n escapes, as the deployment bot stores it
          JWT=$JWT.$(printf %s "$JWT" | openssl dgst -sha256 -sign <(printf %b "$GOOGLE_CALENDAR_PRIVATE_KEY") | b64url)
          TOKEN=$(curl -fsS https://oauth2.googleapis.com/token --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            --data-urlencode assertion="$JWT" | jq -r .access_token)

          # 20-minute event starting a minute from now; Google's response (event link, calendar and account addresses)
          # is discarded so nothing reaches the public log
          jq -n 'now | floor | {
            summary: "[SDK Release] \(env.SDK) \(env.VERSION)", colorId: "8",
            description: "<a href=\"\(env.URL)\">Release notes</a>\n\nCreated by: \(env.AUTHOR)",
            start: {dateTime: (. + 60 | todate), timeZone: "Africa/Cairo"},
            end: {dateTime: (. + 1260 | todate), timeZone: "Africa/Cairo"}}' |
            curl -fsS -o /dev/null -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @- \
              "https://www.googleapis.com/calendar/v3/calendars/$(jq -rn 'env.GOOGLE_CALENDAR_ID | @uri')/events"
